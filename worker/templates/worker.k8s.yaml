# Kubernetes Deployment + KEDA ScaledObject for the {{name}} worker.
# Generated by scripts/new_model.py; edit resources / replica bounds to taste.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-{{dash}}
  labels:
    app.kubernetes.io/name: worker-{{dash}}
    aim.inference/model: {{name}}
spec:
  replicas: {{min}}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-{{dash}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-{{dash}}
        app.kubernetes.io/part-of: aim-inference
        aim.inference/model: {{name}}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      priorityClassName: aim-inference-worker
      terminationGracePeriodSeconds: 1800
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: aimlab/aim-inference-worker-{{dash}}:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 9100}
          envFrom:
            - configMapRef: {name: inference-env}
          env:
            - {name: MODEL_NAME, value: {{name}}}
            - {name: WORKER_IMAGE, value: aimlab/aim-inference-worker-{{dash}}:dev}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: inference-secrets, key: HF_TOKEN, optional: true}
          resources:
            requests: {cpu: "2", memory: 4Gi, nvidia.com/gpu: 1}
            limits: {cpu: "8", memory: 12Gi, nvidia.com/gpu: 1}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: slides, mountPath: /slides, readOnly: true}
            - {name: model-weights, mountPath: /models, readOnly: true}
            - {name: config, mountPath: /app/config.json, subPath: config.json, readOnly: true}
            - {name: scratch, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: slides
          persistentVolumeClaim: {claimName: slides, readOnly: true}
        - name: model-weights
          persistentVolumeClaim: {claimName: model-weights, readOnly: true}
        - name: config
          configMap: {name: inference-config}
        - name: scratch
          emptyDir: {sizeLimit: 20Gi}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-{{dash}}
spec:
  scaleTargetRef:
    name: worker-{{dash}}
  minReplicaCount: {{min}}
  maxReplicaCount: {{max}}
  pollingInterval: 10
  cooldownPeriod: 600
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies: [{type: Pods, value: 1, periodSeconds: 120}]
        scaleUp:
          stabilizationWindowSeconds: 0
          policies: [{type: Pods, value: 4, periodSeconds: 30}]
  triggers:
    - type: redis-streams
      metadata:
        address: redis.aim-inference.svc.cluster.local:6379
        stream: inference:tasks:{{name}}
        # Stream length = regions queued + running (workers XDEL on ack), so
        # replicas = ceil(len / 1). Activation is len > 0: a single queued
        # region wakes a scaled-to-zero pool. (Lag mode cannot do that: KEDA
        # rejects activationLagCount 0.)
        streamLength: "1"
        activationStreamLength: "0"
