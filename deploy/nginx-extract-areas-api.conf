# Load balancer for the extract_areas inference API.
#
# Two upstreams by model pool:
#   general (:8000) → GPUs 0–2 on ports 8001–8003 (deepliif, hovernet, ec_cancer, SAM3)
#   heavy   (:8005) → GPU 3 on port 8004 (pdac)
#
# Aimviewer AI_BACKENDS routes by model; tissue/mask calls always hit general.

upstream general_api {
    zone general_api 64k;
    least_conn;
    server 127.0.0.1:8001 max_fails=0;
    server 127.0.0.1:8002 max_fails=0;
    server 127.0.0.1:8003 max_fails=0;
    keepalive 16;
}

upstream heavy_api {
    zone heavy_api 64k;
    least_conn;
    server 127.0.0.1:8004 max_fails=0;
    keepalive 4;
}

server {
    listen 127.0.0.1:8000;
    server_name _;

    client_max_body_size 1024m;
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://general_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_next_upstream error;
    }
}

server {
    listen 127.0.0.1:8005;
    server_name _;

    client_max_body_size 1024m;
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://heavy_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_next_upstream error;
    }
}
