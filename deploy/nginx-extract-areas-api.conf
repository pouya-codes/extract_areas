# Load balancer for the extract_areas inference API.
#
# Fans requests out across one replica per GPU. Django (aimviewer/api/ai.py)
# talks to BACKEND_API_ADDRESS, which defaults to http://127.0.0.1:8000, so this
# listener is a drop-in replacement for a single-process service on that port.

upstream extract_areas_api {
    # Without a shared zone each nginx worker keeps a private copy of the
    # upstream connection counts, so every worker independently sees all
    # replicas as idle and sends its request to the first one. The zone shares
    # that state so least_conn actually spreads load across the GPUs.
    zone extract_areas_api 64k;

    # Inference requests vary hugely in cost, so route on live connection count
    # rather than round-robin.
    least_conn;

    # max_fails=0 disables passive ejection: a replica busy with a long region
    # is not a failed replica, and taking it out of rotation would pile the
    # whole load onto the remaining GPUs.
    server 127.0.0.1:8001 max_fails=0;
    server 127.0.0.1:8002 max_fails=0;
    server 127.0.0.1:8003 max_fails=0;
    server 127.0.0.1:8004 max_fails=0;

    keepalive 16;
}

server {
    listen 127.0.0.1:8000;
    server_name _;

    # Whole-slide regions and base64 overlays are large.
    client_max_body_size 1024m;
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://extract_areas_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A single large region can occupy a GPU for several minutes.
        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Only retry when a replica was never reached. Retrying after a timeout
        # would re-run inference that may still be executing on the first GPU.
        proxy_next_upstream error;
    }
}
