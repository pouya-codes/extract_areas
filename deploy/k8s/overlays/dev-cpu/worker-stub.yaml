apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-stub
  labels:
    app.kubernetes.io/name: worker-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-stub
        app.kubernetes.io/part-of: aim-inference
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: aimlab/aim-inference-worker-stub:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9100
          envFrom:
            - configMapRef: {name: inference-env}
          env:
            - name: MODEL_NAME
              value: stub
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
      volumes:
        - name: config
          configMap:
            name: inference-config
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-stub
spec:
  scaleTargetRef:
    name: worker-stub
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: redis-streams
      metadata:
        address: redis.aim-inference.svc.cluster.local:6379
        stream: inference:tasks:stub
        # Stream length = regions queued + running (workers XDEL on ack), so
        # replicas = ceil(len / 1). Activation is len > 0: a single queued
        # region wakes a scaled-to-zero pool. (Lag mode cannot do that: KEDA
        # rejects activationLagCount 0.)
        streamLength: "1"
        activationStreamLength: "0"
