apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-env
data:
  REDIS_URL: redis://redis:6379/0
  # host:port form for the KEDA redis-streams scaler
  REDIS_ADDRESS: redis:6379
  SLIDE_ROOTS: /slides
  OVERLAY_STORE: redis
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  JOB_TTL_SECONDS: "21600"
  OVERLAY_TTL_SECONDS: "3600"
  TASK_LEASE_SECONDS: "120"
  TASK_MAX_ATTEMPTS: "2"
  MAX_ACTIVE_JOBS_PER_OWNER: "20"
  MAX_REGIONS_PER_JOB: "500"
