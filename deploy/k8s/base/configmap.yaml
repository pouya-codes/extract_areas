apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-env
data:
  REDIS_URL: redis://redis:6379/0
  # host:port for the KEDA redis-streams scaler. Fully qualified: the KEDA
  # operator runs in the keda namespace, where the short name does not resolve.
  REDIS_ADDRESS: redis.aim-inference.svc.cluster.local:6379
  SLIDE_ROOTS: /slides
  # Prefix of the slide paths AIMViewer sends (OMERO's data dir on the web
  # host) -> where the slides PVC is mounted in the pods.
  SLIDE_PATH_MAP: /data/omero/data=/slides
  OVERLAY_STORE: redis
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  JOB_TTL_SECONDS: "21600"
  OVERLAY_TTL_SECONDS: "3600"
  TASK_LEASE_SECONDS: "120"
  TASK_MAX_ATTEMPTS: "2"
  MAX_ACTIVE_JOBS_PER_OWNER: "20"
  MAX_REGIONS_PER_JOB: "500"
