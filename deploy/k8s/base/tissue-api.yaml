# Slide-mask / tissue-region helpers (SAM3). Synchronous HTTP, one GPU share.
apiVersion: v1
kind: Service
metadata:
  name: tissue-api
  labels:
    app.kubernetes.io/name: tissue-api
spec:
  selector:
    app.kubernetes.io/name: tissue-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tissue-api
  labels:
    app.kubernetes.io/name: tissue-api
    aim.inference/model: sam3
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: tissue-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tissue-api
        app.kubernetes.io/part-of: aim-inference
        aim.inference/model: sam3
    spec:
      priorityClassName: aim-inference-worker
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tissue-api
          image: aimlab/aim-inference-tissue-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: {name: inference-env}
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: inference-secrets, key: HF_TOKEN, optional: true}
            - name: HF_HOME
              value: /tmp/hf
            - name: EXTRACT_AREAS_REDIS_HOST
              value: redis
          resources:
            requests: {cpu: "1", memory: 4Gi, nvidia.com/gpu: 1}
            limits: {cpu: "4", memory: 12Gi, nvidia.com/gpu: 1}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          volumeMounts:
            - name: model-weights
              mountPath: /models
              readOnly: true
            - name: scratch
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: model-weights
            readOnly: true
        - name: scratch
          emptyDir:
            sizeLimit: 20Gi
