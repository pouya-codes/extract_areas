# TEMPLATE ONLY. This file is deliberately NOT in kustomization.yaml: a manifest
# with empty values would overwrite the real Secret on every `kubectl apply -k`.
# Create the real Secret out of band (deploy/k8s/overlays/k3s-local/create-secret.sh,
# or sealed-secrets / external-secrets / sops):
# (sealed-secrets, external-secrets, sops) and never commit values:
#   kubectl -n aim-inference create secret generic inference-secrets \
#     --from-literal=HF_TOKEN=hf_... --from-literal=GATEWAY_API_TOKEN=...
apiVersion: v1
kind: Secret
metadata:
  name: inference-secrets
type: Opaque
stringData:
  HF_TOKEN: ""
  GATEWAY_API_TOKEN: ""
