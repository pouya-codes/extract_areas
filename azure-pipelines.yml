# Platform pipeline: build and push the shared GPU worker base image.
# Per-model images are built from pouya-codes/aim-inference-worker-* repos.
#
# Pool: self-hosted agent on the k3s host (pool name k3s-host).
# Service connection: Azure Resource Manager named aim-inference-acr
#
# Tags:
#   aimlabacr.azurecr.io/aimlab/aim-inference-worker-base:<short-sha>
#   aimlabacr.azurecr.io/aimlab/aim-inference-worker-base:main
trigger:
  batch: true
  branches:
    include:
      - main
      - aimviwer2-AI
  paths:
    include:
      - docker/**
      - worker/**
      - inference_platform/**
      - models/base_model.py
      - models/model_registry.py
      - models/__init__.py
      - slide_region.py
      - progress_report.py
      - auto_batch.py
      - config.py
      - src/**
      - azure-pipelines.yml

pr: none

variables:
  ACR_NAME: aimlabacr
  REGISTRY: aimlabacr.azurecr.io/aimlab
  azureSubscription: aim-inference-acr
  TARGET: worker-base

stages:
  - stage: Build
    displayName: Build and push worker-base
    jobs:
      - job: worker_base
        displayName: worker-base
        pool:
          name: k3s-host
        timeoutInMinutes: 120
        steps:
          # worker-base does not need DeepLIIF/HoVer-Net; those live in the
          # per-model repos. Submodule SSH URLs break this agent (no deploy key).
          - checkout: self
            fetchDepth: 1
            submodules: false

          - task: AzureCLI@2
            displayName: az acr login + docker build/push
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                SHORT_SHA="$(echo '$(Build.SourceVersion)' | cut -c1-12)"
                # Set DOCKER_CONFIG *before* az acr login so credentials are visible to docker push.
                DOCKER_CONFIG="${AGENT_TEMPDIRECTORY}/docker-config"
                mkdir -p "$DOCKER_CONFIG"
                export DOCKER_CONFIG
                az acr login --name "$(ACR_NAME)"
                export REGISTRY="$(REGISTRY)"
                export TAG="$SHORT_SHA"
                # Hardcode — do not use $(TARGET) alone here; an empty expand
                # makes build.sh fall back to ALL targets and require DeepLiff.
                export TARGETS=worker-base
                docker/build.sh --push
                IMAGE="$(REGISTRY)/aim-inference-worker-base:${SHORT_SHA}"
                MAIN="$(REGISTRY)/aim-inference-worker-base:main"
                docker tag "$IMAGE" "$MAIN"
                docker push "$MAIN"
                echo "Pushed $IMAGE and $MAIN"
